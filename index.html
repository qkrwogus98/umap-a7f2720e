.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}

.leaflet-overlay-pane svg {
	-moz-user-select: none;

	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {

	}

	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}

	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);

	}

.leaflet-pan-anim .leaflet-tile {

	   -moz-transition: none;
	        transition: none;
	}

	}

.leaflet-interactive {

	border-bottom-right-radius: 4px;

	color: #bbb;

.leaflet-touch .leaflet-bar a {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function ownerCount(record, owner) {
      return record.owners[owner]?.length || 0;
    }

    /** Owners that are both present on this record and switched on. */
    function visibleOwners(record) {
      return OWNERS.filter(owner => state[owner] && ownerCount(record, owner) > 0);
    }

    function matchesQuery(record) {
      return !state.query || record.searchText.includes(state.query);
    }

    /** Search covers both the full and short school name, the city and every professor. */
    function indexRecord(record) {
      record.searchText = [
        record.school, record.short, record.city, record.state,
        ...record.owners.minseo.map(p => p.professor),
        ...record.owners.jaehyun.map(p => p.professor)
      ].join(" ").toLowerCase();
    }

    records.forEach(indexRecord);
    internationalRecords.forEach(indexRecord);

    function shownRecords() {
      return allRecords.filter(r => visibleOwners(r).length > 0 && matchesQuery(r));
    }

    function ownerListHtml(items) {
      if (!items || items.length === 0) return "<p class='empty'>없음</p>";
      return "<ul>" + items.map(item => {
        const name = item.website
          ? `<a href="${esc(item.website)}" target="_blank" rel="noopener noreferrer">${esc(item.professor)}</a>`
          : esc(item.professor);
        const research = item.research ? `<span>${esc(item.research)}</span>` : "";
        return `<li><strong>${name}</strong>${research}</li>`;
      }).join("") + "</ul>";
    }

    /** 95 -> "1시간 35분", 45 -> "45분". */
    function formatDuration(minutes) {
      if (minutes == null) return null;
      const hours = Math.floor(minutes / 60);
      const rest = minutes % 60;
      if (!hours) return `${rest}분`;
      return rest ? `${hours}시간 ${rest}분` : `${hours}시간`;
    }

    function travelBetween(from, to) {
      if (!travel) return null;
      const minutes = travel.minutes[from.idx]?.[to.idx];
      if (minutes == null) return null;
      return { minutes, km: travel.km[from.idx]?.[to.idx] };
    }

    function nearestSchools(record, count) {
      if (!travel) return [];
      const row = travel.minutes[record.idx];
      if (!row) return [];
      return allRecords
        .filter(other => other.idx !== record.idx && row[other.idx] != null)
        .sort((a, b) => row[a.idx] - row[b.idx])
        .slice(0, count);
    }

    function nearestHtml(record) {
      const near = nearestSchools(record, 3);
      if (!near.length) return "";
      const items = near.map(other => {

        return `<li>

        <ul class="near-list">${items}</ul>
        <button type="button" class="measure-btn" data-measure="${esc(record.school)}">
          다른 학교까지 거리 재기
        </button>
      </div>`;
    }

        <h3><span class="glyph minseo"></span>민서</h3>

        <h3><span class="glyph jaehyun"></span>재현</h3>
        ${ownerListHtml(record.owners.jaehyun)}
        ${nearestHtml(record)}
      </div>`;
    }

    function renderCompareBar(markup, picking) {
      const bar = document.getElementById("compareBar");
      bar.innerHTML = markup || "";
      bar.hidden = !markup;
      document.body.classList.toggle("is-picking", Boolean(picking));
    }

    function startCompare(record) {
      state.compareFrom = record;
      map.closePopup();
      renderCompareBar(`
        <div class="text">
          <span class="route">출발 · ${esc(record.short)}</span>
          <span class="result">도착 학교를 지도에서 고르세요</span>
        </div>
        <button type="button" data-compare-cancel>취소</button>`, true);
    }

    function cancelCompare() {
      state.compareFrom = null;
      renderCompareBar("", false);
    }

    function showComparison(from, to) {
      state.compareFrom = null;
      const trip = travelBetween(from, to);
      const result = trip
        ? `차로 <b>${formatDuration(trip.minutes)}</b> · ${trip.km.toLocaleString()}km`
        : "차로 갈 수 있는 경로가 없습니다";
      renderCompareBar(`
        <div class="text">
          <span class="route">${esc(from.short)} → ${esc(to.short)}</span>
          <span class="result">${result}</span>
        </div>
        <button type="button" data-measure="${esc(to.school)}">여기서 다시</button>
        <button type="button" data-compare-cancel>닫기</button>`, false);
    }

    /** A school click either completes a comparison or opens its popup. */
    function activateSchool(record) {
      if (state.compareFrom && state.compareFrom.idx !== record.idx) {
        showComparison(state.compareFrom, record);
        return;
      }
      openRecordPopup(record);
    }

    function addMarkers() {
      allRecords.forEach(record => {
        const open = event => {
          event.preventDefault();
          event.stopPropagation();
          activateSchool(record);
        };

        const element = document.createElement("button");
        element.type = "button";
        element.className = "overlay-marker";
        element.innerHTML = '<span class="marker"></span>';
        element.addEventListener("click", open);

        // The name beside the dot opens the same popup as the dot.
        const label = document.createElement("button");
        label.type = "button";
        label.className = "map-label";
        label.textContent = record.short;
        label.title = record.school;
        label.addEventListener("click", open);

        // Stop mousedown at the element so a click never starts a map pan.
        [element, label].forEach(el => L.DomEvent.disableClickPropagation(el));

        shortlistPane.appendChild(element);
        entries.push({ record, element, label, labelWidth: 0, labelHeight: 0, x: 0, y: 0, shown: true });
      });

      // Labels go in after every marker so they always paint on top. Appending
      // them per-record let a later school's dot cover an earlier label.
      entries.forEach(entry => shortlistPane.appendChild(entry.label));

      // Label text never changes, so measure once instead of on every redraw.
      entries.forEach(entry => {
        entry.labelWidth = entry.label.offsetWidth;
        entry.labelHeight = entry.label.offsetHeight;
      });

      // Interchange schools claim a label slot first, then the busiest schools.
      labelOrder = entries.slice().sort((a, b) => {
        if (a.record.both !== b.record.both) return a.record.both ? -1 : 1;
        const totalA = ownerCount(a.record, "minseo") + ownerCount(a.record, "jaehyun");
        const totalB = ownerCount(b.record, "minseo") + ownerCount(b.record, "jaehyun");
        if (totalA !== totalB) return totalB - totalA;
        return a.record.school.localeCompare(b.record.school);
      });
    }

    function positionMarkers() {
      entries.forEach(entry => {
        const point = map.latLngToLayerPoint([entry.record.lat, entry.record.lon]);
        entry.x = point.x;
        entry.y = point.y;
        entry.element.style.transform = `translate3d(${point.x - 12}px, ${point.y - 12}px, 0)`;
      });
    }

    function overlaps(box, other) {
      return box.x < other.x + other.w + 6 && other.x < box.x + box.w + 6
          && box.y < other.y + other.h + 3 && other.y < box.y + box.h + 3;
    }

    /**
     * Place as many labels as fit without collisions. At the default US zoom the
     * 28 schools produce 26 overlapping label pairs, so culling is required.
     */
    function layoutLabels() {
      const zoom = map.getZoom();
      const interchangeOnly = zoom <= 4;
      const bounds = map.getBounds();
      const viewWidth = map.getSize().x;
      const viewHeight = map.getSize().y;
      const taken = [];

      // Seed with every visible marker so labels never sit on a dot. Each box
      // remembers its entry: a label is allowed to touch its own marker.
      entries.forEach(entry => {
        if (entry.shown) {
          taken.push({ x: entry.x - 13, y: entry.y - 13, w: 26, h: 26, owner: entry, kind: "marker" });
        }
      });

      labelOrder.forEach(entry => {
        const record = entry.record;
        const eligible = entry.shown
          && (!interchangeOnly || record.both)
          && bounds.contains([record.lat, record.lon]);
        if (!eligible) {
          entry.label.classList.remove("is-visible");
          return;
        }
        const width = entry.labelWidth;
        const height = entry.labelHeight;
        // Prefer the right side, but flip first when the label would run off-screen.
        const containerPoint = map.layerPointToContainerPoint(L.point(entry.x, entry.y));
        const containerX = containerPoint.x;
        // Candidates are in layer space; shift by this to test against the pane.
        const shiftX = containerX - entry.x;
        const shiftY = containerPoint.y - entry.y;
        const onScreen = box =>
          box.x + shiftX >= 6 && box.x + shiftX + box.w <= viewWidth - 6 &&
          box.y + shiftY >= 6 && box.y + shiftY + box.h <= viewHeight - 6;
        const right = { x: entry.x + 16, y: entry.y - height / 2 };
        const left = { x: entry.x - 16 - width, y: entry.y - height / 2 };
        const candidates = containerX + 16 + width > viewWidth - 12
          ? [left, right]
          : [right, left];
        candidates.push(
          { x: entry.x - width / 2, y: entry.y - 15 - height },
          { x: entry.x - width / 2, y: entry.y + 15 },
          { x: entry.x + 12, y: entry.y - 13 - height },
          { x: entry.x - 12 - width, y: entry.y - 13 - height },
          { x: entry.x + 12, y: entry.y + 13 },
          { x: entry.x - 12 - width, y: entry.y + 13 }
        );

        // Every fallback position must also stay inside the pane, or a label
        // pushed off the preferred side ends up clipped at the edge.
        const boxes = candidates
          .map(c => ({ x: c.x, y: c.y, w: width, h: height, owner: entry }))
          .filter(onScreen);
        const clear = other => other.owner !== entry;
        let spot = boxes.find(box => !taken.some(other => clear(other) && overlaps(box, other)));

        // Interchange schools are the point of this map, so if nothing is clear
        // they may sit over a marker — but never over another label.
        if (!spot && record.both) {
          spot = boxes.find(box =>
            !taken.some(other => clear(other) && other.kind !== "marker" && overlaps(box, other)));
        }

        if (!spot) {
          entry.label.classList.remove("is-visible");
          return;
        }
        taken.push(spot);
        entry.label.style.transform = `translate3d(${Math.round(spot.x)}px, ${Math.round(spot.y)}px, 0)`;
        entry.label.classList.add("is-visible");
      });
    }

    function cardHtml(record) {
      const minseo = state.minseo ? ownerCount(record, "minseo") : 0;
      const jaehyun = state.jaehyun ? ownerCount(record, "jaehyun") : 0;
      const owners = visibleOwners(record);
      const glyph = owners.length === 2 ? "both" : owners[0];
      const segments =
        (minseo ? `<i class="minseo" style="flex:${minseo}"></i>` : "") +
        (jaehyun ? `<i class="jaehyun" style="flex:${jaehyun}"></i>` : "");
      return `<button type="button" class="school-card" data-school="${esc(record.school)}">
        <span class="name"><span class="glyph ${glyph}"></span>${esc(record.school)}</span>
        <span class="place">${esc(record.city)}${record.state ? ", " + esc(record.state) : ""}</span>
        <span class="bar">${segments}</span>
        <span class="counts">민서 ${minseo} · 재현 ${jaehyun}</span>
      </button>`;
    }

    function groupHtml(title, list) {
      if (!list.length) return "";
      return `<div class="group">
        <div class="group-head"><b>${title}</b><span>${list.length}</span></div>
        <div class="cards">${list.map(cardHtml).join("")}</div>
      </div>`;
    }

    function renderList() {
      const list = shownRecords().filter(r => r.country === "USA");
      const container = document.getElementById("schoolList");
      if (!list.length) {
        container.innerHTML = "<p class='no-results'>조건에 맞는 학교가 없습니다.</p>";
        return;
      }
      const overlap = list.filter(r => visibleOwners(r).length === 2);
      const single = list.filter(r => visibleOwners(r).length < 2);
      container.innerHTML = groupHtml("겹치는 학교", overlap) + groupHtml("그 외", single);
    }

    function renderStats() {
      const list = shownRecords();
      const professors = list.reduce((sum, record) => (
        sum + (state.minseo ? ownerCount(record, "minseo") : 0)
            + (state.jaehyun ? ownerCount(record, "jaehyun") : 0)
      ), 0);
      const overlap = list.filter(r => visibleOwners(r).length === 2).length;
      document.getElementById("schoolCount").textContent = list.length;
      document.getElementById("profCount").textContent = professors;
      document.getElementById("overlapCount").textContent = overlap;
    }

    function renderInternational() {
      const container = document.getElementById("internationalList");
      const list = shownRecords().filter(r => r.country !== "USA");
      document.getElementById("intlGroup").style.display = list.length ? "" : "none";
      document.getElementById("intlCount").textContent = list.length;
      container.innerHTML = list.map(cardHtml).join("");
    }

    function applyState() {
      entries.forEach(entry => {
        const owners = visibleOwners(entry.record);
        entry.shown = owners.length > 0 && matchesQuery(entry.record);
        entry.element.style.display = entry.shown ? "block" : "none";
        entry.element.querySelector(".marker").className =
          "marker " + (owners.length === 2 ? "both" : (owners[0] || "minseo"));
        entry.element.title = entry.record.school + " · " +
          owners.map(o => `${ownerMeta[o].label} ${ownerCount(entry.record, o)}`).join(" · ");
        entry.label.classList.toggle("is-interchange", owners.length === 2);
      });
      positionMarkers();
      layoutLabels();
      renderList();
      renderStats();
      renderInternational();
    }

    function syncToggle(owner) {
      const input = document.getElementById(owner + "Toggle");
      const wrapper = document.getElementById(owner + "Label");
      state[owner] = input.checked;
      wrapper.classList.toggle("is-off", !input.checked);
    }

    addMarkers();

    document.querySelector(".panel-body").addEventListener("click", event => {
      const card = event.target.closest(".school-card");
      if (!card) return;
      const record = findRecord(card.dataset.school);
      if (!record) return;
      if (!state.compareFrom) {
        map.setView([record.lat, record.lon], 9);
        positionMarkers();
        layoutLabels();
      }
      activateSchool(record);
    });

    // Popup and compare-bar controls are re-created on every render, so bind once here.
    document.addEventListener("click", event => {
      const measure = event.target.closest("[data-measure]");
      if (measure) {
        event.preventDefault();
        event.stopPropagation();
        const record = findRecord(measure.dataset.measure);
        if (record) startCompare(record);
        return;
      }
      const goto = event.target.closest("[data-goto]");
      if (goto) {
        event.preventDefault();
        event.stopPropagation();
        const record = findRecord(goto.dataset.goto);
        if (!record) return;
        map.setView([record.lat, record.lon], Math.max(map.getZoom(), 7));
        positionMarkers();
        layoutLabels();
        openRecordPopup(record);
        return;
      }
      if (event.target.closest("[data-compare-cancel]")) {
        event.preventDefault();
        event.stopPropagation();
        cancelCompare();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && state.compareFrom) cancelCompare();
    });

    OWNERS.forEach(owner => {
      document.getElementById(owner + "Toggle").addEventListener("change", () => {
        syncToggle(owner);
        applyState();
      });
    });

    document.getElementById("search").addEventListener("input", event => {
      state.query = event.target.value.trim().toLowerCase();
      applyState();
    });

    map.on("move zoom moveend zoomend viewreset resize", () => {
      positionMarkers();
      layoutLabels();
    });

    if ("ResizeObserver" in window) {
      new ResizeObserver(() => {
        map.invalidateSize();
        if (!userMovedMap) fitHome();
        positionMarkers();
        layoutLabels();
      }).observe(document.getElementById("map"));
    }

    // Notion embeds size the iframe after load; re-measure once things settle.
    setTimeout(() => {
      map.invalidateSize();
      if (!userMovedMap) fitHome();
      positionMarkers();
      layoutLabels();
    }, 150);

    fitHome();
    applyState();

    // On first paint the pane can still be settling, so the initial fit is based
    // on a stale size and labels visibly jump once it corrects. Re-fit on the
    // next frame to close that gap instead of waiting for the 150ms pass.
    requestAnimationFrame(() => {
      map.invalidateSize();
      if (!userMovedMap) fitHome();
      positionMarkers();
      layoutLabels();
    });
  </script>
</body>
</html>
